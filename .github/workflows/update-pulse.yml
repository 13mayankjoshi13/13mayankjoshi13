name: Update Commit Pulse

on:
  schedule:
    - cron: "0 */6 * * *"   # refreshes every 6 hours
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "now-building.txt"

jobs:
  pulse:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate pulse card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: python3 generate_pulse.py

      - name: Commit updated SVG
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add images/pulse.svg
          git diff --staged --quiet || git commit -m "update commit pulse [skip ci]"
          git push
