<svg viewBox="0 0 440 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Desk illustration with a laptop, coffee mug, and a small plant">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181B3A"/>
      <stop offset="100%" stop-color="#241246"/>
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .cursor2 { animation: blink2 1.1s steps(1) infinite; }
      @keyframes blink2 { 0%,49%{opacity:1;} 50%,100%{opacity:0;} }
      .steamA { animation: steamUp 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom; }
      .steamB { animation: steamUp 3.2s ease-in-out infinite 0.9s; transform-box: fill-box; transform-origin: bottom; }
      @keyframes steamUp { 0%{ transform: translateY(0) scaleY(1); opacity: 0.6;} 60%{ opacity: 0.2;} 100%{ transform: translateY(-14px) scaleY(1.15); opacity: 0;} }
      .glowpulse { animation: gp 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes gp { 0%,100%{ opacity:0.6; } 50%{ opacity:0.9; } }
    </style>
  </defs>

  <rect x="0" y="0" width="440" height="300" rx="18" fill="url(#bg2)"/>
  <circle class="glowpulse" cx="220" cy="140" r="120" fill="url(#glow2)"/>

  <!-- desk -->
  <rect x="0" y="230" width="440" height="70" fill="#2A2350"/>
  <rect x="0" y="230" width="440" height="5" fill="#4C3B8A"/>

  <!-- plant -->
  <path d="M356 205 q-12 -28 2 -44 q14 16 2 44 Z" fill="#34D399"/>
  <path d="M362 205 q4 -25 19 -34 q4 18 -12 34 Z" fill="#22B583"/>
  <rect x="348" y="203" width="28" height="24" rx="4" fill="#EC4899"/>

  <!-- mug -->
  <rect x="86" y="196" width="30" height="24" rx="4" fill="#F1F5F9"/>
  <path d="M116 200 q13 0 13 8 t-13 8" fill="none" stroke="#F1F5F9" stroke-width="4"/>
  <path class="steamA" d="M94 192 q-4 -10 4 -16" fill="none" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
  <path class="steamB" d="M106 192 q4 -10 -2 -16" fill="none" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>

  <!-- laptop -->
  <path d="M150 214 L294 214 L308 234 L136 234 Z" fill="#4C3B8A"/>
  <rect x="160" y="122" width="124" height="92" rx="6" fill="#12142B"/>
  <rect x="170" y="132" width="104" height="72" rx="3" fill="#1B1E3D"/>
  <rect x="178" y="142" width="52" height="6" rx="3" fill="#38BDF8"/>
  <rect x="178" y="154" width="70" height="6" rx="3" fill="#A855F7"/>
  <rect x="178" y="166" width="40" height="6" rx="3" fill="#EC4899" opacity="0.85"/>
  <rect x="178" y="178" width="60" height="6" rx="3" fill="#34D399" opacity="0.85"/>
  <rect class="cursor2" x="178" y="190" width="8" height="7" fill="#F8FAFC"/>

</svg>
