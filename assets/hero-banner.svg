<svg viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mayank Joshi, full-stack developer, AI and ML enthusiast">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12142B"/>
      <stop offset="55%" stop-color="#181B3A"/>
      <stop offset="100%" stop-color="#1F1440"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="35%" stop-color="#EC4899"/>
      <stop offset="70%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="blobPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="avatarBack" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0.15"/>
    </radialGradient>
    <style>
      .pill-text { font-family: 'Courier New', monospace; font-size: 17px; fill: #7DD3FC; }
      .hello { font-family: 'Courier New', monospace; font-size: 17px; fill: #7DD3FC; }
      .im { font-family: Georgia, serif; font-style: italic; font-size: 26px; fill: #CBD5E1; }
      .name { font-family: Verdana, Arial, sans-serif; font-weight: 800; font-size: 68px; }
      .subtitle { font-family: Verdana, Arial, sans-serif; font-weight: 700; font-size: 27px; fill: #F1F5F9; }
      .tagline { font-family: Verdana, Arial, sans-serif; font-size: 16px; fill: #94A3B8; }
      .chip-text { font-family: Verdana, Arial, sans-serif; font-weight: 600; font-size: 15px; fill: #E2E8F0; }
      .quote { font-family: Georgia, serif; font-style: italic; font-size: 20px; fill: #FDE68A; }
      .sparkle { animation: twinkle 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .sparkle2 { animation: twinkle 2.6s ease-in-out infinite 1.1s; transform-box: fill-box; transform-origin: center; }
      @keyframes twinkle { 0%,100%{ opacity:0.35; transform: scale(0.85);} 50%{ opacity:1; transform: scale(1.15);} }
      .float { animation: floaty 4.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes floaty { 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-8px);} }
      .barwave { animation: shimmer 3s ease-in-out infinite; }
      @keyframes shimmer { 0%,100%{ opacity: 0.85;} 50%{ opacity: 1;} }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="420" rx="20" fill="url(#bgGrad)"/>

  <!-- decorative blobs -->
  <circle cx="960" cy="180" r="220" fill="url(#blobPurple)"/>
  <circle cx="140" cy="90" r="130" fill="url(#blobBlue)"/>
  <circle cx="1080" cy="360" r="150" fill="url(#blobPink)"/>

  <!-- sparkles -->
  <g class="sparkle" fill="#7DD3FC">
    <path d="M30 60 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4 Z"/>
  </g>
  <g class="sparkle2" fill="#FBBF24">
    <path d="M620 40 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 Z"/>
  </g>

  <!-- hello pill -->
  <rect x="60" y="34" width="182" height="34" rx="17" fill="none" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="80" y="57" class="hello">&gt; Hello, World!</text>

  <!-- name block -->
  <text x="60" y="128" class="im">I'm</text>
  <text x="60" y="205" class="name" fill="#F8FAFC">MAYANK</text>
  <text x="425" y="205" class="name" fill="url(#nameGrad)">JOSHI</text>
  <text x="60" y="248" class="subtitle">Full-Stack Developer | AI &amp; ML Enthusiast</text>

  <rect class="barwave" x="60" y="266" width="360" height="6" rx="3" fill="url(#barGrad)"/>

  <text x="60" y="304" class="tagline">Building real-world solutions, one line of code at a time.</text>

  <!-- chips -->
  <g>
    <rect x="60" y="330" width="96" height="42" rx="21" fill="#1E2246" stroke="#334155"/>
    <text x="78" y="357" class="chip-text">&lt;/&gt; Code</text>

    <rect x="168" y="330" width="96" height="42" rx="21" fill="#1E2246" stroke="#334155"/>
    <text x="186" y="357" class="chip-text">◆ Build</text>

    <rect x="276" y="330" width="96" height="42" rx="21" fill="#1E2246" stroke="#334155"/>
    <text x="298" y="357" class="chip-text">Learn</text>

    <rect x="384" y="330" width="106" height="42" rx="21" fill="#1E2246" stroke="#334155"/>
    <text x="400" y="357" class="chip-text">&#8734; Repeat</text>
  </g>

  <!-- avatar -->
  <circle cx="980" cy="210" r="150" fill="url(#avatarBack)"/>

  <g class="float">
    <!-- crossed legs -->
    <path d="M896 348 q6 -46 78 -50 q10 20 -6 34 q-40 6 -46 30 Z" fill="#3E4C63"/>
    <path d="M1060 348 q-6 -46 -78 -50 q-10 20 6 34 q40 6 46 30 Z" fill="#4B5A73"/>
    <!-- torso / hoodie -->
    <path d="M918 268 q0 -78 60 -78 q60 0 60 78 l-6 46 l-108 0 Z" fill="#1B1E33"/>
    <path d="M978 200 v34" stroke="#12141F" stroke-width="5" stroke-linecap="round"/>
    <circle cx="972" cy="238" r="3" fill="#12141F"/>
    <circle cx="972" cy="252" r="3" fill="#12141F"/>
    <!-- arm resting on knee -->
    <path d="M926 280 q-20 24 -14 46" fill="none" stroke="#1B1E33" stroke-width="19" stroke-linecap="round"/>
    <circle cx="906" cy="330" r="9" fill="#C98A5B"/>
    <!-- neck -->
    <rect x="962" y="205" width="30" height="18" rx="8" fill="#C98A5B"/>
    <!-- head -->
    <circle cx="977" cy="178" r="42" fill="#D9A066"/>
    <!-- curly hair -->
    <g fill="#1E1A16">
      <circle cx="940" cy="150" r="15"/>
      <circle cx="952" cy="134" r="15"/>
      <circle cx="972" cy="126" r="16"/>
      <circle cx="994" cy="130" r="15"/>
      <circle cx="1010" cy="146" r="14"/>
      <circle cx="1014" cy="164" r="11"/>
      <circle cx="938" cy="168" r="10"/>
    </g>
    <!-- sunglasses -->
    <rect x="944" y="172" width="30" height="18" rx="7" fill="#0B0D14"/>
    <rect x="984" y="172" width="30" height="18" rx="7" fill="#0B0D14"/>
    <rect x="974" y="178" width="10" height="4" fill="#0B0D14"/>
    <!-- smile -->
    <path d="M962 202 q15 10 30 0" fill="none" stroke="#7A4B2A" stroke-width="3" stroke-linecap="round"/>
    <!-- crown -->
    <path d="M954 100 l7 -20 11 13 11 -13 11 13 7 -13 4 20 Z" fill="none" stroke="#FBBF24" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- quote -->
  <text x="1090" y="108" class="quote" text-anchor="middle">&#8220;Dream. Code.</text>
  <text x="1090" y="134" class="quote" text-anchor="middle">Build. Create.&#8221;</text>

  <!-- dashed trail -->
  <g class="float" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 5">
    <path d="M1120 160 q-20 45 -4 90"/>
  </g>
  <path d="M1108 240 l16 0 -8 16 Z" fill="#E2E8F0"/>

</svg>
